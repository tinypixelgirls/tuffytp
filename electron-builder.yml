appId: com.tuffytp.app
productName: TuffYTP
directories:
  output: dist
files:
  - out/**
  - package.json
asarUnpack:
  - node_modules/ffmpeg-static/**
  - node_modules/ffprobe-static/**
win:
  target: nsis
  files:
    - '!node_modules/ffprobe-static/bin/{darwin,linux}/**'
  icon: build/icon.ico
nsis:
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
mac:
  target: dmg
  files:
    - '!node_modules/ffprobe-static/bin/{win32,linux}/**'
  icon: build/icon.png
linux:
  target: AppImage
  files:
    - '!node_modules/ffprobe-static/bin/{win32,darwin}/**'
  icon: build/icon.png
